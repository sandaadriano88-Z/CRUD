services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: CRUD_WEB

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html

    environment:
      DB_HOST: cn-hex-mold.sage.cloud.layerbase.dev
      DB_PORT: 47183
      DB_NAME: cn
      DB_USER: root
      DB_PASSWORD: TDXMm2sVOQm9oJWcyv1TFVgm

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: mariadb:11.4

    container_name: CRUD_DB

    environment:
      MARIADB_ROOT_PASSWORD: cnpassword
      MARIADB_DATABASE: cn
      MARIADB_USER: cn_user
      MARIADB_PASSWORD: cnpassword

    ports:
      - "3307:3306"

    volumes:
      - crud_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  crud_data: